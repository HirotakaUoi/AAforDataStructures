<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AAforDataStructures – データ構造可視化</title>
  <link rel="stylesheet" href="/static/css/style.css?v=6">
</head>
<body>

  <!-- ===== ヘッダー ===== -->
  <header>
    <!-- 1行目: タイトル + パネル操作 -->
    <div class="header-row">
      <h1>AAforDataStructures – データ構造可視化</h1>
      <div id="toolbar">
        <button id="btn-add-panel"  class="btn btn-add">＋ パネル追加</button>
        <button id="btn-start-all"  class="btn btn-success">▶▶ 全開始</button>
        <button id="btn-pause-all"  class="btn btn-warning">⏸ 全一時停止</button>
        <button id="btn-stop-all"   class="btn btn-danger">⏹ 全停止</button>
        <button id="btn-reset-all"  class="btn btn-secondary">↺ 全リセット</button>
        <button id="btn-sync-size"  class="btn btn-secondary" title="最前面のパネルサイズに全パネルを合わせる">⊞ サイズ統一</button>
        <span style="display:inline-flex;align-items:center;gap:4px;margin-left:6px;border-left:1px solid #555;padding-left:10px">
          <label style="font-size:0.85em;white-space:nowrap">データ数
            <select id="global-size" style="margin-left:4px"></select>
          </label>
          <button id="btn-apply-global" class="btn btn-secondary" title="全非実行パネルのデータ数とシードを統一">↕ 全パネルへ適用</button>
        </span>
        <div id="zoom-controls">
          <button id="btn-zoom-out"   class="btn btn-secondary" title="縮小">－</button>
          <span   id="zoom-label">100%</span>
          <button id="btn-zoom-in"    class="btn btn-secondary" title="拡大">＋</button>
          <button id="btn-zoom-reset" class="btn btn-secondary" title="ズームリセット">↺</button>
        </div>
        <div id="theme-controls">
          <button class="btn btn-secondary theme-btn theme-active" data-th="dark"     title="ダーク">🌙</button>
          <button class="btn btn-secondary theme-btn"              data-th="bright"   title="明るめ">☀</button>
          <button class="btn btn-secondary theme-btn"              data-th="hc"       title="コントラスト強め (暗め)">◑</button>
          <button class="btn btn-secondary theme-btn"              data-th="hcbright" title="コントラスト強め (明るめ)">◐</button>
        </div>
      </div>
    </div>
  </header>

  <!-- ===== パネルグリッド ===== -->
  <main id="panels-container"></main>

  <!-- ===== スクリプト ===== -->
  <script src="/static/js/array_canvas.js?v=48"></script>
  <script src="/static/js/ws_client.js?v=1"></script>
  <script src="/static/js/app.js?v=36"></script>
</body>
</html>
